[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[project]
name = "assessment-ai-engineer"
version = "0.1.0"
description = "Source-backed AI breakthroughs and locations from historical books"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3,<1",
  "sentence-transformers>=3.4,<6",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
  "pandas>=2.2,<3",
  "ipywidgets>=8,<9",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
  "nbformat>=5,<6",
  "matplotlib>=3.9,<4",
  "folium>=0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
